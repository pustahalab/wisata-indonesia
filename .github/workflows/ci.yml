name: NusantaraGo CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Project Structure
        run: |
          echo "Verifying NusantaraGo Monorepo Structure..."
          test -d apps/mobile
          test -d apps/web-portal
          test -d apps/admin-partner
          test -d services/api-core
          echo "Structure verification passed!"
