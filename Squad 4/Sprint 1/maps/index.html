<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NusantaraGo Maps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>NusantaraGo - Maps</h2>
    <p>Lokasi penginapan dan layanan transportasi.</p>

    <!-- Kalkulasi jarak awal (Distance Matrix API) -->
    <form id="dm-form" autocomplete="off">
        <label>Origin
            <input id="dm-origin" type="text" value="-6.3271234,108.3201234"
                   placeholder="lat,lng atau alamat">
        </label>
        <label>Destination
            <input id="dm-destination" type="text" value="-6.3451234,108.3101234"
                   placeholder="lat,lng atau alamat">
        </label>
        <button id="dm-submit" type="submit" disabled>Hitung Jarak</button>
    </form>

    <ul id="dm-steps" aria-label="Tahap pengujian">
        <li id="step-sdk"      data-state="pending">1. Google Maps SDK dimuat</li>
        <li id="step-sent"     data-state="pending">2. Permintaan Distance Matrix dikirim</li>
        <li id="step-response" data-state="pending">3. Respons Distance Matrix diterima</li>
        <li id="step-distance" data-state="pending">4. Nilai jarak berhasil dibaca</li>
    </ul>
    <div id="dm-result" role="status" aria-live="polite"></div>
    <div id="status" role="alert"></div>

    <div id="map"></div>

    <!-- config.js berisi API key (tidak di-commit). Salin dari config.example.js -->
    <script src="config.js"></script>
    <script src="distance.js"></script>
    <!-- SDK Google Maps dimuat secara dinamis oleh script.js memakai key dari config.js -->
    <script src="script.js"></script>

</body>
</html>
